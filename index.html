<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="甜點廚房">
<meta name="robots" content="noindex">
<title>甜點廚房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap">
<style>
/* Layout: one calm column, a fixed 4-step rail on every lesson, big touch targets for iPad/phone */
:root {
  --bg: #EEF2EF;
  --surface: #FFFFFF;
  --surface-2: #F6F8F6;
  --ink: #1D2A28;
  --muted: #5B6966;
  --line: #D5DDD8;
  --accent: #1E6B66;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEDEA;
  --verb: #C2410C;
  --verb-bg: #FFE9DA;
  --ok: #2C7A35;
  --ok-bg: #E3F2E4;
  --hint: #7A5C00;
  --hint-bg: #FFF4CF;
  --gold: #A87A12;
  --shadow: 0 1px 2px rgba(20, 40, 36, .06), 0 4px 14px rgba(20, 40, 36, .06);
  --f-en: "Lexend", "Noto Sans TC", system-ui, sans-serif;
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-fancy: "Fraunces", Georgia, "Noto Sans TC", serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131A19; --surface: #1C2524; --surface-2: #222D2C; --ink: #E6EDEB; --muted: #A1AFAC; --line: #33413F;
    --accent: #5BBDB4; --accent-ink: #0E1716; --accent-soft: #1F3A37;
    --verb: #FF8F57; --verb-bg: #3B2417; --ok: #82CF87; --ok-bg: #1E3521; --hint: #EBCB6B; --hint-bg: #352C12; --gold: #E2B954;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131A19; --surface: #1C2524; --surface-2: #222D2C; --ink: #E6EDEB; --muted: #A1AFAC; --line: #33413F;
  --accent: #5BBDB4; --accent-ink: #0E1716; --accent-soft: #1F3A37;
  --verb: #FF8F57; --verb-bg: #3B2417; --ok: #82CF87; --ok-bg: #1E3521; --hint: #EBCB6B; --hint-bg: #352C12; --gold: #E2B954;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-zh); font-size: 18px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
  display: flex; flex-direction: column; gap: 16px;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.3; }
p { margin: 0; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 24px; font-weight: 700; letter-spacing: .02em; }
.brand span { font-family: var(--f-fancy); font-style: italic; color: var(--gold); font-size: 17px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 14px;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; font-size: 16px; font-weight: 500;
}
.chip b { font-family: var(--f-en); font-variant-numeric: tabular-nums; }

/* cards & buttons */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.btn {
  min-height: 56px; padding: 12px 22px; border-radius: 14px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-size: 20px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn.big { min-height: 64px; font-size: 22px; width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 500; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 160px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }

/* step rail */
.rail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.dots i.done { background: var(--gold); border-color: var(--gold); }
.dots i.now { border-color: var(--accent); background: var(--accent-soft); }
.dots span { font-family: var(--f-en); font-size: 15px; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

/* stamp card */
.stamps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .stamps { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stamp {
  aspect-ratio: 1; border-radius: 50%; border: 2px dashed var(--line); background: transparent; padding: 0;
  display: flex; align-items: center; justify-content: center; font-family: var(--f-en); font-weight: 600; font-size: 17px; color: var(--muted); min-width: 0;
}
.stamp.got { border: 2px solid var(--gold); background: var(--surface); box-shadow: var(--shadow); padding: 4px; }
.stamp.got svg { width: 100%; height: auto; }
.stamp.next { border-color: var(--accent); color: var(--accent); }
.stamp { position: relative; }
.stamp .star {
  position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--gold); color: var(--surface); font-size: 13px; line-height: 22px; text-align: center; box-shadow: var(--shadow);
}
.plan-today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.plan-today div { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.plan-today b { display: block; font-size: 22px; font-family: var(--f-en); }
.plan-today span { font-size: 15px; color: var(--muted); }
.tag { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.new { background: var(--verb-bg); color: var(--verb); }
.starline { color: var(--gold); font-weight: 700; font-size: 20px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.cell .stamp { width: 100%; cursor: pointer; }
.cell .stars { color: var(--gold); font-size: 11px; line-height: 1.2; min-height: 14px; letter-spacing: -.5px; white-space: nowrap; }
.cell .today { font-size: 12px; line-height: 1.25; font-weight: 700; color: var(--accent); text-align: center; min-height: 15px; white-space: nowrap; }
.cell .today.new { color: var(--verb); }
.cell .today.done { color: var(--ok); }
/* 今天練過的句子：綠色外框＋右上角綠色勾勾 */
.stamp.got.td { border: 3px solid var(--ok); box-shadow: 0 0 0 4px var(--ok-bg); }
.stamp .chk {
  position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--ok); color: var(--surface); font-size: 15px; font-weight: 700; line-height: 26px; text-align: center; box-shadow: var(--shadow);
}
.tdsum { color: var(--ok); font-weight: 700; }
.tdline { color: var(--ok) !important; font-weight: 700; }
.opt.find { align-items: flex-start; text-align: left; }
.opt.find .oe { font-size: 22px; }
.opt.found { border-color: var(--ok); background: var(--ok-bg); }
.opt.glow { border-color: var(--accent); background: var(--accent-soft); }
.gloss { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.gloss span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.gloss .ge { font-family: var(--f-en); font-size: 22px; font-weight: 600; }
.gloss .gz { font-size: 16px; color: var(--muted); }
select#voice { font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); flex: 1 1 220px; min-width: 0; max-width: 100%; min-height: 48px; }
.shelf-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 720px) { .shelf-list { grid-template-columns: 1fr 1fr; } }
.srow { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; min-width: 0; }
.srow.locked { background: transparent; box-shadow: none; border: 2px dashed var(--line); }
.sart { flex: none; width: 88px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 72px; }
.sart svg { width: 100%; height: auto; }
.sart .q { font-family: var(--f-en); font-size: 26px; font-weight: 700; color: var(--muted); }
.stext { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.sname { border: 0; background: none; padding: 0; font-size: 17px; font-weight: 700; text-align: left; }
.ssay { border: 0; background: var(--surface-2); border-radius: 10px; padding: 6px 10px; text-align: left; display: flex; flex-direction: column; gap: 0; }
.ssay .sen { font-family: var(--f-en); font-weight: 600; font-size: 18px; }
.ssay .szh { font-size: 15px; color: var(--muted); }
.ssay:active { background: var(--accent-soft); }
.why { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 10px 14px; font-size: 18px; font-weight: 500; text-align: center; }
.btn2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 420px) { .choice { grid-template-columns: 1fr; } }
.choice .btn { flex-direction: column; gap: 0; min-height: 84px; }
.choice .btn small { font-size: 14px; font-weight: 500; opacity: .85; }
.rail div {
  border-radius: 12px; padding: 8px 4px; text-align: center; font-size: 15px; font-weight: 500;
  background: var(--surface); border: 1.5px solid var(--line); color: var(--muted);
}
.rail div .n { display: block; font-family: var(--f-en); font-size: 13px; font-weight: 600; }
.rail div.now { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.rail div.done { color: var(--ok); border-color: transparent; background: var(--ok-bg); }
.rail div.skip { opacity: .5; border-style: dashed; }

/* video */
.vid { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 1280 / 744; max-width: 100%; }
.vid video { width: 100%; height: 100%; display: block; object-fit: cover; }
.vid.small { width: min(100%, calc(30vh * 1280 / 744)); margin: 0 auto; }
.vid .cover {
  position: absolute; inset: 0; border: 0; background: rgba(0,0,0,.12);
  display: flex; align-items: center; justify-content: center;
}
.vid .cover svg { width: 72px; height: 72px; }
.vid.playing .cover { display: none; }
.listen {
  border: 2px dashed var(--line); border-radius: 14px; background: var(--surface-2);
  min-height: 150px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-size: 18px; font-weight: 500;
}
.listen svg { width: 64px; height: 64px; color: var(--accent); }
.listen.playing { border-color: var(--accent); background: var(--accent-soft); }

/* subtitles */
.subs { display: flex; flex-direction: column; gap: 6px; padding: 14px 8px 4px; text-align: center; }
.en { font-family: var(--f-en); font-weight: 600; font-size: clamp(28px, 6.4vw, 44px); line-height: 1.3; letter-spacing: .005em; }
.zh { font-family: var(--f-zh); font-size: clamp(22px, 4.6vw, 30px); font-weight: 500; color: var(--ink); }
.v { color: var(--verb); background: var(--verb-bg); border-radius: 8px; padding: 0 .18em; font-weight: 700; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.w { border: 0; background: none; padding: 0 .06em; border-radius: 8px; font: inherit; }
.w:active { background: var(--accent-soft); }
.meaning { min-height: 34px; text-align: center; font-size: 18px; color: var(--muted); }
.meaning b { font-family: var(--f-en); color: var(--ink); }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--muted); }
.note b { color: var(--ink); }

/* questions */
.ask { font-size: 21px; font-weight: 700; }
.opts { display: grid; gap: 12px; }
.opts.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .opts.two { grid-template-columns: 1fr; } }
.opt {
  min-height: 72px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center;
}
.opt .oe { font-family: var(--f-en); font-size: 24px; font-weight: 600; }
.opt .oz { font-size: 17px; color: var(--muted); }
.opt.sent .oe { font-size: 22px; }
.opt.yes { border-color: var(--ok); background: var(--ok-bg); }
.opt.no { opacity: .35; border-style: dashed; }
.fb { min-height: 30px; font-size: 18px; font-weight: 500; text-align: center; }
.fb.good { color: var(--ok); }
.fb.try { color: var(--hint); background: var(--hint-bg); border-radius: 10px; padding: 6px 10px; }
.qcount { font-family: var(--f-en); font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* sentence builder */
.slots { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 64px; padding: 10px; border-radius: 14px; background: var(--surface-2); border: 2px dashed var(--line); }
.slot { min-width: 54px; height: 48px; border-bottom: 3px solid var(--line); }
.tiles { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.tile {
  font-family: var(--f-en); font-size: 26px; font-weight: 600; min-height: 56px; padding: 6px 18px;
  border-radius: 12px; border: 2px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
}
.placed { font-family: var(--f-en); font-size: 26px; font-weight: 600; min-height: 48px; padding: 4px 6px; display: inline-flex; align-items: center; }
.tile.used { visibility: hidden; }
.tile.shake { animation: shake .35s; }
.tile.glow { border-color: var(--accent); background: var(--accent-soft); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* home */
.today { display: grid; grid-template-columns: 1fr; gap: 14px; }
.plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plan li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.plan .k { font-family: var(--f-en); font-weight: 700; color: var(--accent); width: 22px; text-align: center; }
.plan .t { margin-left: auto; font-size: 15px; color: var(--muted); font-family: var(--f-en); }
.mystery { display: flex; align-items: center; gap: 14px; }
.mystery .box { width: 72px; height: 72px; flex: none; border-radius: 16px; border: 2px dashed var(--gold); display: flex; align-items: center; justify-content: center; font-family: var(--f-en); font-size: 30px; color: var(--gold); font-weight: 700; }

/* collection */
.shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.dess {
  border: 0; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); padding: 10px 6px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0;
}
.dess svg { width: 100%; max-width: 120px; height: auto; }
.dess .dn { font-size: 15px; font-weight: 700; line-height: 1.3; text-align: center; }
.dess.locked { background: transparent; box-shadow: none; border: 2px dashed var(--line); color: var(--muted); justify-content: center; min-height: 140px; cursor: default; }
.dess.locked .q { font-family: var(--f-en); font-size: 28px; font-weight: 700; }
.dess.locked .dn { font-weight: 400; }

/* dessert detail */
.reveal { align-items: center; text-align: center; }
.reveal svg { width: min(260px, 70%); height: auto; }
.reveal.pop svg { animation: pop .7s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.dname { font-size: 30px; font-weight: 700; }
.dname-en { font-family: var(--f-fancy); font-style: italic; font-size: 22px; color: var(--gold); }
.facts { display: grid; gap: 8px; text-align: left; width: 100%; }
.facts div { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; font-size: 17px; }
.facts b { color: var(--muted); font-weight: 500; margin-right: 8px; }
.overlay {
  position: fixed; inset: 0; background: rgba(10, 20, 18, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.overlay .card { width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; }
@media (min-width: 700px) { .overlay { align-items: center; } }

/* review list & parent */
.list { display: grid; gap: 10px; }
.list button { text-align: left; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 14px; min-height: 56px; display: flex; gap: 12px; align-items: center; }
.list .num { font-family: var(--f-en); color: var(--muted); font-variant-numeric: tabular-nums; width: 26px; flex: none; }
.list .ls { font-family: var(--f-en); font-size: 20px; font-weight: 600; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
input[type=text], input[type=number] { font: inherit; font-size: 20px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); width: 120px; }
.foot { text-align: center; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 15px; min-height: 44px; padding: 8px 12px; }

/* spelling with letter tiles */
.word { display: flex; gap: 6px; justify-content: center; }
.lt {
  flex: 0 1 46px; min-width: 0; aspect-ratio: 46 / 58; border-radius: 10px; border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-family: var(--f-en); font-size: clamp(20px, 6vw, 30px); font-weight: 600;
}
.lt.given { border-color: transparent; background: var(--surface-2); }
.lt.blank { border-style: dashed; }
.lt.cur { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.lt.fill { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.tile.letter { min-width: 56px; font-size: 28px; }
.frame { font-size: clamp(24px, 5.4vw, 36px); }
.gap { display: inline-block; min-width: 2.2em; border-bottom: 3px solid var(--accent); color: var(--accent); }
button.gap { font: inherit; background: var(--accent-soft); border: 0; border-bottom: 3px solid var(--accent); border-radius: 8px 8px 0 0; padding: 0 .15em; cursor: pointer; }
button.gap:active, button.gap.say { background: var(--accent); color: var(--accent-ink); }

/* 找錯句：一次一句的 O / X */
.opt.find.oxs { align-items: center; min-height: 96px; }
.oxrow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ox {
  min-height: 112px; border-radius: 18px; border: 3px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--f-en); font-size: 56px; font-weight: 700; line-height: 1;
}
.ox small { font-family: var(--f-zh); font-size: 17px; font-weight: 500; color: var(--muted); }
.ox.o { color: var(--ok); }
.ox.x { color: var(--verb); }
.ox.yes { border-color: var(--ok); background: var(--ok-bg); }
.ox.shake { animation: shake .35s; }
.ox[disabled] { opacity: .45; cursor: default; }

/* stars: lit ones in gold, the rest faded */
.stars .off { opacity: .22; }
.wlist { display: grid; gap: 6px; width: 100%; }
.wrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; text-align: left; }

/* ---------- 朗讀聲音：家長選的優先，沒選就自動挑高音質的美式英文 ---------- */
const VOICE_PREF = ["Ava", "Samantha", "Allison", "Zoe", "Nicky", "Evan", "Nathan", "Tom"];
function englishVoices() {
  try { return speechSynthesis.getVoices().filter((v) => /^en[-_]/i.test(v.lang)); } catch (e) { return []; }
}
function autoVoice(vs) {
  const us = vs.filter((v) => /^en[-_]US/i.test(v.lang));
  const pool = us.length ? us : vs;
  const hq = (v) => /premium|enhanced|高音質|增強/i.test(v.name);
  const rank = (v) => { const i = VOICE_PREF.findIndex((p) => v.name.includes(p)); return (hq(v) ? 0 : 100) + (i < 0 ? 50 : i); };
  return pool.slice().sort((a, b) => rank(a) - rank(b))[0] || null;
}
function pickVoice() {
  const vs = englishVoices();
  return (st.voice && vs.find((v) => v.voiceURI === st.voice)) || autoVoice(vs);
}
function utter(w) {
  const u = new SpeechSynthesisUtterance(w);
  const v = pickVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-US";
  u.rate = 0.8;
  return u;
}
try { speechSynthesis.getVoices(); } catch (e) {}
function fillVoices() {
  const sel = $("#voice"); if (!sel) return;
  const vs = englishVoices();
  const auto = autoVoice(vs);
  const cur = pickVoice();
  const label = (v) => `${v.name}（${v.lang}）`;
  sel.innerHTML = `<option value="">自動挑選${auto ? `：${label(auto)}` : ""}</option>` +
    vs.map((v) => `<option value="${v.voiceURI.replace(/"/g, "&quot;")}">${label(v)}</option>`).join("");
  sel.value = st.voice && vs.some((v) => v.voiceURI === st.voice) ? st.voice : "";
  $("#voiceNow").textContent = vs.length
    ? `現在使用：${cur ? label(cur) : "系統預設"}，共 ${vs.length} 個英文聲音可選。`
    : "這台裝置沒有提供可選的英文聲音，會使用系統預設聲音。";
}

function speak(w) {
  try {
    const u = utter(w);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
// 先念完再執行 cb；念不出來或 onend 沒觸發時，用計時器保底
function speakThen(w, cb) {
  let done = false;
  const fin = () => { if (!done) { done = true; cb(); } };
  setTimeout(fin, Math.max(900, w.length * 110));
  try {
    const u = utter(w);
    u.onend = fin; u.onerror = fin;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { fin(); }
}
// 單獨念 "I" 時，語音會念成 "capital I"，改成照發音念
const spoken = (w) => w === "I" ? "eye" : w;
// 排隊念：不打斷前一個字，點很快也會一個一個念完；cb 在這一句念完後執行
let queueEnd = 0;
function sayQueued(w, cb) {
  const now = Date.now();
  queueEnd = Math.max(now, queueEnd) + Math.max(700, w.length * 110);
  let done = false;
  const fin = () => { if (!done) { done = true; cb && cb(); } };
  setTimeout(fin, queueEnd - now + 400);
  try {
    const u = utter(w);
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
  } catch (e) { fin(); }
}

function zhHTML(n) { const s = S[n]; return s.zh.replace(s.zv, `<span class="v">${s.zv}</span>`); }

/* ---------- 拼單字（字母磚） ---------- */
// 挖空 count 個字母：先挖母音（a e i o u），不夠再挖子音；動詞結尾的 ing 不挖
// 另外加 2 個干擾字母（1 個母音、1 個子音），都不是要填的字母
const VOWELS = "aeiou";
function spellPlan(word, count, verb) {
  const end = verb && word.endsWith("ing") ? word.length - 3 : word.length;
  const idx = [...Array(end).keys()];
  const vow = shuffle(idx.filter((i) => VOWELS.includes(word[i])));
  const con = shuffle(idx.filter((i) => !VOWELS.includes(word[i])));
  const miss = [...vow, ...con].slice(0, Math.min(count, idx.length)).sort((a, b) => a - b);
  const need = miss.map((i) => word[i]);
  const pick = (abc) => shuffle(abc.split("").filter((c) => !need.includes(c)))[0];
  const extra = [pick(VOWELS), pick("bcdfghklmnprstvwy")].filter(Boolean);
  return { miss, tiles: shuffle([...need, ...extra]) };
}
// o = { n 句子, k 單字, miss 缺幾個字母, count 題數標籤, mount(html) 放上畫面, done(clean) 回傳完成訊息, nextLabel, next }
// clean ＝ 沒按錯、沒用提示，一次就拼對
function spellQ(o) {
  const { n, k } = o, word = wText(k), plan = spellPlan(word, o.miss, isVerb(k));
  let pos = 0, clean = true, locked = false;
  const box = (i) => plan.miss.includes(i) ? `<span class="lt blank" data-p="${i}"></span>` : `<span class="lt given">${word[i]}</span>`;
  o.mount(`<div class="card">
    <div class="row" style="justify-content:space-between"><p class="ask">拼出「${zhOf(k, n)}」的英文</p>${o.count || ""}</div>
    <p class="muted small">按句子裡的 <b style="color:var(--accent)">？</b> 可以聽這個字怎麼念。</p>
    ${loopHTML(n)}
    <div class="subs" id="sent"><p class="en frame">${frameHTML(n, k)}</p><p class="zh">${zhMark(n, k)}</p></div>
    <div class="word">${[...word].map((_, i) => box(i)).join("")}</div>
    <div class="tiles" id="tiles">${plan.tiles.map((c) => `<button class="tile letter" data-c="${c}">${c}</button>`).join("")}</div>
    <p class="fb" id="fb"></p>
    <div class="row" id="hintRow"><button class="btn ghost" id="hint">給我提示</button></div>
    <button class="btn big" id="next" hidden></button>
  </div>`);
  wireLoop();
  // 聽發音不算用提示：還是要自己把字拼出來
  $("#sayw").onclick = () => {
    const g = $("#sayw"); g.classList.add("say");
    speakThen(word, () => g.classList.remove("say"));
  };
  const fb = $("#fb");
  const want = () => word[plan.miss[pos]];
  const mark = () => $$(".lt.blank").forEach((s) => s.classList.toggle("cur", +s.dataset.p === plan.miss[pos]));
  const glowRight = () => {
    const t = $$(".tile.letter").find((t) => !t.classList.contains("used") && t.dataset.c === want());
    if (t) t.classList.add("glow");
  };
  mark();
  $$(".tile.letter").forEach((b) => b.onclick = () => {
    if (locked || pos >= plan.miss.length || b.classList.contains("used")) return;
    if (b.dataset.c === want()) {
      const s = $(`.lt[data-p="${plan.miss[pos]}"]`);
      s.textContent = b.dataset.c; s.className = "lt fill";
      b.classList.add("used"); $$(".tile").forEach((t) => t.classList.remove("glow"));
      pos++;
      fb.className = "fb"; fb.textContent = "";
      mark();
      if (pos === plan.miss.length) finish();
    } else {
      // 按錯：不扣分，亮出正確的字母，停 1 秒，避免一直亂按
      clean = false; locked = true;
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      glowRight();
      fb.className = "fb try"; fb.textContent = "不是這個字母，看看發亮的那一個。";
      setTimeout(() => { locked = false; }, 1000);
    }
  });
  $("#hint").onclick = () => { clean = false; glowRight(); };
  function finish() {
    sfxWord();
    $("#tiles").hidden = true; $("#hintRow").hidden = true;
    $("#sent").innerHTML = `<p class="en">${enHTML(n)}</p><p class="zh">${zhHTML(n)}</p>`;
    fb.className = clean ? "fb good" : "fb";
    fb.innerHTML = o.done(clean);
    const nx = $("#next");
    nx.textContent = typeof o.nextLabel === "function" ? o.nextLabel() : o.nextLabel;
    // 念完單字和整句，才出現下一步
    speakThen(word, () => speakThen(enOf(n), () => { if (nx.isConnected) { nx.hidden = false; nx.focus(); } }));
  }
  $("#next").onclick = o.next;
}

/* ---------- 一句的流程（新句子和複習一樣）：看影片 → 拼單字 → 排句子 → 找錯句 ---------- */
const STEP_NAMES = ["看影片", "拼單字", "排句子", "找錯句"];
let L = null;
function startItem(n, kind) {
  L = { n, kind, step: 0, si: 0, mistakes: 0, spell: [], start: Date.now() };
  runStep();
}
function lessonShell(body) {
  const rail = STEP_NAMES.map((nm, i) => {
    const c = i < L.step ? "done" : i === L.step ? "now" : "";
    return `<div class="${c}"><span class="n">${i < L.step ? "✓" : i + 1}</span>${nm}</div>`;
  }).join("");
  const tag = L.kind === "new" ? `<span class="tag new">新句子</span>` : `<span class="tag">複習</span>`;

    <button class="chip" id="rest">休息一下</button></div>

  $("#rest").onclick = home;
  window.scrollTo(0, 0);
}
function runStep() {
  stopVideo();
  [watch, spellStep, build, findWrong, itemDone][L.step]();
}
function nextStep() { L.step++; runStep(); }

function watch() {
  const n = L.n;
  lessonShell(`<div class="card">
    <p class="ask">請播放影片</p>
    ${videoHTML(n)}
    <div class="subs"><p class="en">${enHTML(n, true)}</p><p class="zh">${zhHTML(n)}</p></div>
    <p class="meaning" id="mean">按一下英文單字，可以聽發音、看意思</p>
    <div class="note"><b>I am ＋ 動詞-ing</b> ＝ 我正在做某件事。${TIPS[n] ? "<br>" + TIPS[n] : ""}</div>
    <p class="muted small">等一下要拼出 <b style="font-family:var(--f-en)">${S[n].v}</b> 和 <b style="font-family:var(--f-en)">${nounOf(n)}</b>，看清楚它們怎麼拼。</p>
    <p class="muted small" id="wait">按影片中間的播放鍵，看完一次就會出現下一步。</p>
    <button class="btn big" id="go" hidden>下一步：拼單字</button>
  </div>`);
  wireVideo(() => { const g = $("#go"); if (g && g.hidden) { g.hidden = false; $("#wait").hidden = true; } });
  wireWords(n);
  $("#go").onclick = nextStep;
}

// 先拼動詞，再拼名詞；難度跟著這個字現在的階段
function spellStep() {
  const k = keysOf(L.n)[L.si];
  spellQ({
    n: L.n, k, miss: missCount(L.n),
    count: `<span class="qcount">${L.si + 1} / 2</span>`,
    mount: lessonShell,
    done: (clean) => {
      recordSpell(k, clean); save();
      L.spell.push([k, clean]);
      if (!clean) L.mistakes++;
      return clean ? "一次就拼對！" : "拼好了！";
    },
    nextLabel: L.si === 0 ? "下一個字" : "下一步：排句子",
    next: () => { stopVideo(); if (L.si === 0) { L.si = 1; spellStep(); } else { L.si = 0; nextStep(); } },
  });
}

function build() {
  const n = L.n;
  const words = wordsOf(n);
  let order = shuffle(words.map((_, i) => i));
  if (order.every((v, i) => v === i)) order = order.reverse();
  let placed = 0, locked = false;
  lessonShell(`<div class="card">
    <p class="ask">照順序按字卡，排出句子</p>
    <p class="zh" style="text-align:center">${zhHTML(n)}</p>
    <div class="slots" id="slots">${words.map(() => `<span class="slot"></span>`).join("")}</div>
    <div class="tiles">${order.map((i) => `<button class="tile" data-i="${i}">${words[i]}</button>`).join("")}</div>
    <p class="fb" id="fb"></p>
    <div class="row"><button class="btn ghost" id="hint">給我提示</button></div>
    <button class="btn big" id="next" hidden>下一步：找錯句</button>
  </div>`);
  const fb = $("#fb");
  try { speechSynthesis.cancel(); } catch (e) {}
  queueEnd = 0;
  // 按對：字卡立刻移上去，並排隊念出；按錯：不移、不念，晃一下並停 1 秒
  $$(".tile").forEach((b) => b.onclick = () => {
    const i = +b.dataset.i;
    if (locked || placed >= words.length || b.classList.contains("used")) return;
    if (words[i] === words[placed]) {
      $(".slot").outerHTML = `<span class="placed">${i === 2 ? `<span class="v">${words[i]}</span>` : words[i]}${placed === words.length - 1 ? "." : ""}</span>`;
      b.classList.add("used"); $$(".tile").forEach((t) => t.classList.remove("glow"));
      placed++;
      fb.className = "fb"; fb.textContent = "";
      sayQueued(spoken(words[i]));
      if (placed === words.length) {
        $(".tiles").hidden = true; $("#hint").hidden = true;
        fb.className = "fb good"; fb.textContent = "全部排對了！";
        sayQueued(enOf(n), () => { const nx = $("#next"); if (nx) nx.hidden = false; });
      }
    } else {
      L.mistakes++; locked = true;
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      fb.className = "fb try"; fb.textContent = "不是這個字。想想中文的順序，或按「給我提示」。";
      setTimeout(() => { locked = false; }, 1000);
    }
  });
  $("#hint").onclick = () => {
    const t = $$(".tile").find((t) => !t.classList.contains("used") && words[+t.dataset.i] === words[placed]);
    if (t) t.classList.add("glow");
  };
  $("#next").onclick = nextStep;
}

// 找錯句：一次一句，判斷這件事做得到（○）還是做不到（✕）
// 共 4 句：隨機 1 句錯（3 對 1 錯）或 2 句錯（2 對 2 錯）；先念完句子才能作答；答錯不計入選錯次數，晃一下並停 1 秒再答
function findWrong() {
  const [a, b, bad, why] = F[L.n], [bad2, why2] = F2[L.n];
  const good = shuffle([a, b, F3[L.n]]).map((s) => ({ s, bad: false }));
  const wrong = shuffle([{ s: bad, bad: true, why }, { s: bad2, bad: true, why: why2 }]);
  const items = Math.random() < 0.5 ? [...good.slice(0, 2), ...wrong] : [...good, wrong[0]];
  L.fw = { items: shuffle(items), i: 0 };
  oxQ();
}
function oxQ() {
  const { items, i } = L.fw, it = items[i], last = i === items.length - 1;
  lessonShell(`<div class="card">
    <div class="row" style="justify-content:space-between"><p class="ask">這件事做得到嗎？</p><span class="qcount">${i + 1} / ${items.length}</span></div>
    <p class="muted small">四句裡，有時一句做不到，有時兩句做不到。按句子可以再聽一次。</p>
    <button class="opt find oxs" id="say">${glossHTML(it.s)}</button>
    <div class="oxrow">
      <button class="ox o" data-a="o" disabled>○<small>做得到</small></button>
      <button class="ox x" data-a="x" disabled>✕<small>做不到</small></button>
    </div>
    <p class="fb" id="fb"></p>
    <p class="why" id="why" hidden></p>
    <button class="btn big" id="next" hidden>${last ? "完成這一句" : "下一句"}</button>
  </div>`);
  let busy = true;
  const unlock = () => { busy = false; $$(".ox").forEach((x) => { x.disabled = false; }); };
  speakThen(fEn(it.s), unlock);
  $("#say").onclick = () => speak(fEn(it.s));
  $$(".ox").forEach((btn) => btn.onclick = () => {
    if (busy || !$("#next").hidden) return;
    const fb = $("#fb");
    if ((btn.dataset.a === "x") === it.bad) {
      btn.classList.add("yes");
      $$(".ox").forEach((x) => { if (x !== btn) x.disabled = true; });
      fb.className = "fb good"; fb.textContent = it.bad ? "對！這件事做不到。" : "對！這件事做得到。";
      if (it.bad) { $("#why").textContent = it.why; $("#why").hidden = false; }
      sfxWord();
      $("#next").hidden = false; $("#next").focus();
    } else {
      busy = true;
      btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
      fb.className = "fb try"; fb.textContent = it.bad ? "再想一想：這件事真的做得到嗎？" : "再想一想：這件事真的做不到嗎？";
      setTimeout(() => { busy = false; }, 1000);
    }
  });
  $("#next").onclick = () => { if (last) nextStep(); else { L.fw.i++; oxQ(); } };
}

function itemDone() {
  const { n } = L;
  const t = today();
  const secs = Math.round((Date.now() - L.start) / 1000);
  stopVideo();
  const isNew = !isLearned(n);
  const before = starsOf(n);
  if (isNew) {
    st.learned.push(n);
    st.info[n] = { learned: t, reviews: 0, lastReview: "", star: 1, starOn: t };
  } else {
    const I = st.info[n];
    I.reviews++;
    I.lastReview = t;
    if (I.starOn !== t && I.star < MAX_STARS) { I.star++; I.starOn = t; }
  }
  const newStar = starsOf(n) > before;
  st.log.push({ kind: isNew ? "new" : "rev", n: n + 1, date: t, secs, mistakes: L.mistakes });
  save();
  sendReport(isNew ? "new" : "review", n, secs, L.mistakes, newStar, L.spell);
  L = null;
  const [cheerEn, cheerZh] = PRAISE[Math.floor(Math.random() * PRAISE.length)];
  if (isNew) {
    app.innerHTML = dessertCard(n, "pop", cheerEn, cheerZh);
  } else {
    const why = newStar ? "" : starsOf(n) >= MAX_STARS ? "5 顆星星都亮了，再練習一樣很棒！" : "這句今天已經亮過星星了，明天再練習可以再亮一顆。";
    app.innerHTML = `<div class="card reveal pop">
      <p class="cheer">${cheerEn}</p><p class="muted">${cheerZh}練習完成！</p>
      ${ART[n]}
      <div class="subs"><p class="en">${enHTML(n)}</p><p class="zh">${zhHTML(n)}</p></div>
      ${newStar ? `<p class="starline">亮了一顆星星！</p>` : ""}
      <p class="starline big">${starsHTML(n, newStar)}</p>
      <p class="muted">這句已經練習 ${timesOf(n)} 次。${why}</p>
      <button class="btn big" id="ok">回集點卡</button>
    </div>`;
  }
  $("#ok").onclick = home;
  window.scrollTo(0, 0);
  celebrate(newStar, cheerEn);
}

/* ---------- 聲光鼓勵：音效用 Web Audio 即時產生，不用音檔 ---------- */
const PRAISE = [["Great job!", "做得很好！"], ["Well done!", "太棒了！"], ["Awesome!", "超厲害！"], ["You did it!", "你做到了！"], ["Excellent!", "非常好！"], ["Fantastic!", "好厲害！"]];
const sfxOn = () => st.sfx !== false;
let actx = null;
function audio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, at, dur, vol = 0.16, type = "triangle") {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
// 拼完一個字：輕輕的「叮咚」
function sfxWord() { if (sfxOn()) { tone(880, 0, 0.18, 0.12); tone(1320, 0.1, 0.3, 0.12); } }
// 完成一句：上行的四個音；亮星星時再加兩聲閃亮的高音
function sfxFanfare(star) {
  if (!sfxOn()) return;
  [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.4));
  if (star) [1568, 2093].forEach((f, i) => tone(f, 0.62 + i * 0.12, 0.5, 0.1, "sine"));
}
function confetti() {
  try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (e) {}
  const c = document.createElement("canvas");
  c.className = "confetti";
  document.body.appendChild(c);
  const dpr = window.devicePixelRatio || 1;
  const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
  const x = c.getContext("2d");
  const cols = ["#E2B954", "#5BBDB4", "#FF8F57", "#F2A7BB", "#82CF87", "#B9D98A"];
  const ps = Array.from({ length: 150 }, () => ({
    x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.3,
    vx: (Math.random() - 0.5) * W * 0.02, vy: -(Math.random() * H * 0.018 + H * 0.006),
    r: (5 + Math.random() * 6) * dpr, c: cols[Math.floor(Math.random() * cols.length)],
    a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3,
  }));
  const LIFE = 2400, t0 = performance.now();
  (function frame(now) {
    const el = now - t0;
    x.clearRect(0, 0, W, H);
    x.globalAlpha = Math.max(0, 1 - el / LIFE);
    ps.forEach((p) => {
      p.vy += H * 0.0008; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore();
    });
    if (el < LIFE) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
// 完成一句：音效＋彩帶，接著用英文說一句稱讚
function celebrate(star, cheerEn) {
  sfxFanfare(star);
  confetti();
  setTimeout(() => speak(cheerEn), star ? 1300 : 900);
}

/* ---------- 寄信通知：每練習完一句（新句或複習）都寄 ---------- */
function sendReport(kind, n, secs, mistakes, newStar, spell) {
  queueReport({
    kind, date: today(), n: n + 1, sentence: enOf(n), zh: S[n].zh,
    dessert: D[n].name, dessertEn: D[n].en, minutes: Math.round(secs / 6) / 10, mistakes,
    reviews: st.info[n].reviews, times: timesOf(n), stars: starsOf(n), newStar,
    words: (spell || []).map(([k, ok]) => `${wText(k)}（${zhOf(k, n)}）${ok ? "一次就拼對" : "有拼錯或用了提示"}`).join("、"),
    collected: st.learned.length, totalStars: totalStars(),
  });
}
function queueReport(body) {
  if (!REPORT_URL) return;
  st.outbox = st.outbox || [];
  st.outbox.push({ token: REPORT_TOKEN, ...body });
  save();
  flushReports();
}
// 沒有網路時先存起來，下次打開網頁再寄
let flushing = false;
async function flushReports() {
  if (!REPORT_URL || flushing || !st.outbox || !st.outbox.length) return;
  flushing = true;
  while (st.outbox.length) {
    try {
      await postReport(st.outbox[0]);
      st.outbox.shift(); save();
    } catch (e) { break; }
  }
  flushing = false;
}
function postReport(body) {
  // Apps Script 不回傳 CORS 標頭，所以用 no-cors；只有網路失敗時才會進到 catch
  return fetch(REPORT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
}
window.addEventListener("online", flushReports);

      ${REPORT_URL ? `<div class="row"><button class="btn ghost" id="testMail">寄一封測試信</button></div><p class="fb" id="mailFb"></p>` : ""}</div>
    <div class="card"><h3>朗讀聲音</h3>
      <p class="muted small">列出這台裝置的 Safari 可以用的英文聲音。選好後按「試聽」確認，選擇只存在這台裝置上。</p>
      <div class="row"><select id="voice" aria-label="朗讀聲音"></select><button class="btn ghost" id="tryVoice">試聽</button></div>
      <p class="small muted" id="voiceNow"></p></div>
    <div class="card"><h3>音效</h3>
      <label class="row"><input type="checkbox" id="sfx" ${sfxOn() ? "checked" : ""}> 拼完單字、完成一句時播放音效</label>
      <p class="muted small">孩子對聲音敏感時可以關掉。完成一句時的彩帶和英文稱讚會保留。</p></div>
    <div class="card"><h3>重設</h3>
      <div class="row"><button class="btn ghost" id="reset">${confirmReset ? "再按一次，確定清除全部進度" : "清除全部進度"}</button></div></div>`;
  $("#back").onclick = home;
  fillVoices();
  try { speechSynthesis.onvoiceschanged = () => { if ($("#voice")) fillVoices(); }; } catch (e) {}
  $("#voice").onchange = () => { st.voice = $("#voice").value; save(); fillVoices(); speak("I am chopping onions."); };
  $("#tryVoice").onclick = () => speak("I am chopping onions.");
  $("#sfx").onchange = () => { st.sfx = $("#sfx").checked; save(); if (st.sfx) sfxFanfare(true); };
  const tm = $("#testMail");
  if (tm) tm.onclick = () => {
    tm.disabled = true;
    postReport({ token: REPORT_TOKEN, kind: "test", date: today(), collected: st.learned.length })
      .then(() => { $("#mailFb").className = "fb good"; $("#mailFb").textContent = `已送出，請到 ${REPORT_TO} 收信（可能要等 1 分鐘）。`; })
      .catch(() => { $("#mailFb").className = "fb try"; $("#mailFb").textContent = "送不出去，請確認 iPad 有連上網路。"; tm.disabled = false; });
  };
  $("#reset").onclick = () => {
    if (!confirmReset) return parent(true);
    st = { ...fresh(), voice: st.voice || "", sfx: sfxOn() }; save(); home();
  };
}

home();
flushReports();
</script>
</body>
</html>
